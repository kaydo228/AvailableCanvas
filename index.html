<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prostor</title>
    <!-- Шрифты не подключаются из сети: лежат в public/fonts, объявлены
         в src/index.css. Доска обещает работать локально — значит,
         и без интернета она должна выглядеть так же. -->
    <!-- Тема ставится до первой отрисовки: иначе тёмная страница моргает белым. -->
    <script>
      try {
        var t = localStorage.getItem('prostor-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
