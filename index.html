<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prostor</title>
    <!-- Шрифты не подключаются из сети: лежат в public/fonts, объявлены
         в src/index.css. Доска обещает работать локально — значит,
         и без интернета она должна выглядеть так же. -->
    <!-- Тема ставится до первой отрисовки: иначе тёмная страница моргает белым. -->
    <script>
      try {
        var t = localStorage.getItem('prostor-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- GitHub Pages отдает 404 для прямого перехода на /p/... или /s/....
         404.html возвращает путь в параметре, а здесь восстанавливаем его
         до запуска React Router. В локальной разработке base равен пустоте. -->
    <script>
      var redirect = new URLSearchParams(window.location.search).get('redirect');
      if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
        var base = window.location.pathname.replace(/\/$/, '');
        window.history.replaceState(null, '', base + redirect);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
