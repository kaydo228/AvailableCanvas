<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prostor</title>
    <!--
      Шрифты не грузятся из сети: критерий приёмки 12 требует пустую вкладку
      Network после загрузки, а запрос к fonts.googleapis.com — это исходящий
      запрос с IP и Referer пользователя. Golos Text и IBM Plex Mono остались
      первыми в --font-sans/--font-mono: у кого стоят в системе, тот их и видит,
      остальные получают системный стек из того же объявления.
    -->
    <!-- Тема ставится до первой отрисовки: иначе тёмная страница моргает белым. -->
    <script>
      try {
        var t = localStorage.getItem('prostor-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
